# coturn's production configuration (14-server-deployment step 7): the development
# file (infra/coturn/turnserver.conf, #8) plus this machine's realm, addresses and TLS.
#
# Install as /etc/turnserver.conf (/etc/turnserver/turnserver.conf on Arch Linux, D107),
# owned by root and readable by the turnserver group only (chmod 640), then replace the two
# <...> placeholders ON THE MACHINE. The secret never goes into the repository: it is the
# backend's RELAY_SECRET from /etc/newcord/env.

listening-port=3478
# TLS is reached only through nginx on port 443 (D53); the firewall keeps 5349 closed.
tls-listening-port=5349
min-port=49152
max-port=49407

realm=newcord-turn.duckdns.org
# Oracle machines sit behind one-to-one address translation: public IP, then private IP.
external-ip=<public IP>/<private IP>

use-auth-secret
static-auth-secret=<RELAY_SECRET from /etc/newcord/env>

# The relay's certificate, copied here by /etc/newcord/copy-turn-cert.sh on every renewal.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
syslog

# Never relay into private, loopback or link-local networks behind the relay.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
