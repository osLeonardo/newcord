# Port 443 shared by name (D53, 14-server-deployment step 4). nginx reads only the
# requested name, then passes the connection on still encrypted, adding the client's
# real address with the PROXY protocol so the backend's per-IP rate limits keep working.
#
# Install as /etc/nginx/stream.d/newcord.conf and include it at the top level of
# /etc/nginx/nginx.conf, outside the http block:  include /etc/nginx/stream.d/*.conf;
# Needs the stream module (package libnginx-mod-stream on Ubuntu, nginx-mod-stream on Arch
# Linux, whose nginx.conf is deploy/nginx/arch-nginx.conf).

stream {
  map $ssl_preread_server_name $route {
    newcord.duckdns.org       127.0.0.1:8443;
    newcord-turn.duckdns.org  127.0.0.1:9349;
  }

  server {
    listen 443;
    ssl_preread on;
    proxy_protocol on;
    proxy_pass $route;
  }

  # coturn does not read the client-address header, so strip it here
  server {
    listen 127.0.0.1:9349 proxy_protocol;
    proxy_pass 127.0.0.1:5349;
  }
}
