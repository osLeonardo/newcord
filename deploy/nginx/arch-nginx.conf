# The whole of /etc/nginx/nginx.conf on Arch Linux (D107). Arch's nginx has no sites-enabled
# folder, so this file replaces the package's and includes the same folders as Ubuntu's layout:
# sites-enabled in the http block, stream.d at the top level. Then newcord.conf and stream.conf
# install exactly as in MANUAL.md section 7.
#
# Install as /etc/nginx/nginx.conf, after creating /etc/nginx/sites-available,
# /etc/nginx/sites-enabled and /etc/nginx/stream.d. The stream module comes from the
# nginx-mod-stream package, which loads it from modules.d.

include /etc/nginx/modules.d/*.conf;

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  include /etc/nginx/sites-enabled/*.conf;
}

include /etc/nginx/stream.d/*.conf;
