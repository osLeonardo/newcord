# The http side (14-server-deployment step 5): port 80 for certificate checks and
# redirects, and a local TLS endpoint that forwards to the backend, WebSockets included.
#
# Install as /etc/nginx/sites-available/newcord.conf, link it into sites-enabled,
# and remove the default site, which also listens on port 80.

server {
  listen 80;
  server_name newcord.duckdns.org newcord-turn.duckdns.org;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 127.0.0.1:8443 ssl proxy_protocol;
  server_name newcord.duckdns.org;
  ssl_certificate     /etc/letsencrypt/live/newcord.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/newcord.duckdns.org/privkey.pem;
  set_real_ip_from 127.0.0.1;
  real_ip_header proxy_protocol;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_protocol_addr;
    proxy_read_timeout 1h;
  }
}
