# When a version tag is pushed, builds the Windows installer and the server bundle for the Oracle
# machine, and uploads both to a draft GitHub release, to be checked and published by hand (D48,
# D49, D96, D104, 12-m5-build steps 9–10). Every action is pinned to a full commit hash.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  server:
    # Built on Linux Arm like the machine, with read-only access; the release job attaches it (D104).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, the version from package.json's packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: bash deploy/scripts/build-server-bundle.sh "${GITHUB_REF_NAME#v}" server-bundle
      - run: bash deploy/scripts/check-server-bundle.sh server-bundle/newcord-server-*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-bundle
          path: server-bundle/*.tar.gz
          if-no-files-found: error
  release:
    needs: server
    runs-on: windows-latest
    # The job that publishes: it alone may write to the repository's releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, the version from package.json's packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - name: Check that the tag names the app's version
        shell: bash
        run: |
          version="v$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the app's version $version" >&2
            exit 1
          fi
      - run: rustup target add wasm32-unknown-unknown
      - name: Install the wasm-bindgen-cli matching the crate
        shell: bash
        run: |
          version=$(sed -n 's/^wasm-bindgen = "=\([^"]*\)".*/\1/p' packages/mls/Cargo.toml)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: pnpm install --frozen-lockfile
      # Builds the MLS module, then the app (D94).
      - run: pnpm --filter @newcord/mls build
      - run: pnpm --filter desktop build
      # electron-builder uploads its files in parallel, and each upload made its own draft when none
      # existed yet (v0.1.0 got two); with the draft created first, they all land in it.
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes ""
      - run: pnpm --filter desktop exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-bundle
          path: apps/desktop/dist
      - name: Attach the server bundle to the draft
        shell: bash
        working-directory: apps/desktop/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" newcord-server-*.tar.gz --repo "$GITHUB_REPOSITORY"
      - name: Add each file's SHA-256 to the draft's notes and as SHA256SUMS
        shell: bash
        working-directory: apps/desktop/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum -- *.exe *.blockmap latest.yml newcord-server-*.tar.gz > SHA256SUMS
          {
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body
            printf '\n## SHA-256\n\n```\n'
            cat SHA256SUMS
            printf '```\n'
          } > release-notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          # newcord-update on the machine checks the server bundle against this file (D105).
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY"
