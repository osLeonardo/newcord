# Builds the Windows installer and publishes it to GitHub Releases when a version tag is pushed
# (D48, D49, 12-m5-build steps 9–10). Every action is pinned to a full commit hash.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    # The only job, and the one that publishes: it alone may write to the repository's releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, the version from package.json's packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - name: Check that the tag names the app's version
        shell: bash
        run: |
          version="v$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the app's version $version" >&2
            exit 1
          fi
      - run: rustup target add wasm32-unknown-unknown
      - name: Install the wasm-bindgen-cli matching the crate
        shell: bash
        run: |
          version=$(sed -n 's/^wasm-bindgen = "=\([^"]*\)".*/\1/p' packages/mls/Cargo.toml)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: pnpm install --frozen-lockfile
      # Builds the MLS module, then the app (D94).
      - run: pnpm --filter @newcord/mls build
      - run: pnpm --filter desktop build
      - run: pnpm --filter desktop exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Add each file's SHA-256 to the release notes
        shell: bash
        working-directory: apps/desktop/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body
            printf '\n## SHA-256\n\n```\n'
            sha256sum -- *.exe *.blockmap latest.yml
            printf '```\n'
          } > release-notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
