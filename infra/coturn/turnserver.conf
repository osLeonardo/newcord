# coturn configuration for newcord's relay (D23, 10-m3-build step 1), shared by
# development (#8) and production (#14, which adds its realm, addresses and TLS).
# No secret lives here: start coturn with --static-auth-secret set to the
# server's RELAY_SECRET, so only short-lived passwords from GET /relay/credentials work.

listening-port=3478
min-port=49152
max-port=49407

use-auth-secret
fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1

# Never relay into private, loopback or link-local networks behind the relay.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
